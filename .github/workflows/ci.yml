name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            pkg-config \
            libfontconfig-dev \
            libfreetype-dev \
            libvulkan-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-randr0-dev \
            libxcb-xinput-dev \
            libxcb-cursor-dev \
            libxcb-sync-dev \
            libxcb-render0-dev \
            libxcb-present-dev
      - run: cargo fmt --all -- --check
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets --all-features -- --deny warnings
      - run: cargo test --locked -p scheduler
      - run: cargo test --locked -p gpui --features test-support
      - run: cargo check --locked -p gpui --examples
      - run: cargo check --locked -p gpui --features bench --benches
      - run: cargo check --locked -p gpui_wgpu --benches

  native-platform:
    name: Native platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Ensure Metal toolchain is available
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -f metal > /dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -f metal
      - run: cargo check --locked --workspace --all-targets
      - name: Test macOS platform
        if: runner.os == 'macOS'
        run: cargo test --locked -p gpui_macos --all-features --all-targets
      - name: Test Windows platform
        if: runner.os == 'Windows'
        run: cargo test --locked -p gpui_windows --all-features --all-targets
      - name: Compile Windows shaders in release mode
        if: runner.os == 'Windows'
        run: cargo check --locked -p gpui_windows --release

  linux-backend:
    name: Linux (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        backend: [wayland, x11]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.backend }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            pkg-config \
            libfontconfig-dev \
            libfreetype-dev \
            libvulkan-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-randr0-dev \
            libxcb-xinput-dev \
            libxcb-cursor-dev \
            libxcb-sync-dev \
            libxcb-render0-dev \
            libxcb-present-dev
      - run: cargo check --locked -p gpui_platform --no-default-features --features ${{ matrix.backend }} --all-targets

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: -C target-feature=+atomics,+bulk-memory,+mutable-globals
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - run: cargo +nightly -Zbuild-std=std,panic_abort check --locked --target wasm32-unknown-unknown -p gpui_platform
      - run: cargo +nightly -Zbuild-std=std,panic_abort check --locked --target wasm32-unknown-unknown -p gpui --example a11y --example view_example
